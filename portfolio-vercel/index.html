<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="박상욱 Game QA 포트폴리오"
    />
    <title>Game QA Portfolio — 박상욱</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="portfolio" aria-label="Game QA 포트폴리오">
      <div class="viewer" id="viewer">
        <div class="stage" id="stage" aria-live="polite">
          <img
            id="slideImage"
            class="slide-image"
            src="./slides/slide-01.webp"
            alt="Game QA 포트폴리오 1페이지"
            width="1684"
            height="1190"
          />

          <button
            id="projectsButton"
            class="hotspot slide-action slide-action--projects"
            type="button"
            aria-label="프로젝트 살펴보기: 7페이지로 이동"
          ></button>

          <button
            id="skillsButton"
            class="hotspot slide-action slide-action--skills"
            type="button"
            aria-label="QA 역량 보기: 4페이지로 이동"
          ></button>

          <a
            id="caseLink"
            class="hotspot source-link source-link--case"
            href="https://docs.google.com/spreadsheets/d/1hbx3CXFIFtCbK5_5Sm0QAXMJRWcv4BaV/edit?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="전체 테스트 케이스 원본을 새 탭에서 열기"
          ></a>

          <a
            id="bugLink"
            class="hotspot source-link source-link--bug"
            href="https://drive.google.com/file/d/1oeCyYKT9EicnQ7_fClcqoOf2HO4-Ij6W/view?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="KAN-15 버그 리포트 원본을 새 탭에서 열기"
          ></a>
        </div>

        <button class="nav-button nav-button--previous" id="previousButton" type="button" aria-label="이전 페이지">
          <span aria-hidden="true">‹</span>
        </button>
        <button class="nav-button nav-button--next" id="nextButton" type="button" aria-label="다음 페이지">
          <span aria-hidden="true">›</span>
        </button>
      </div>

      <nav class="controls" aria-label="슬라이드 이동">
        <span class="page-number" id="pageNumber">01 / 10</span>
        <div class="progress" aria-hidden="true">
          <span class="progress__value" id="progressValue"></span>
        </div>
        <button class="fullscreen-button" id="fullscreenButton" type="button">전체 화면</button>
      </nav>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
